name: C++ CI

on:
  pull_request:
    branches: [develop]
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install gcovr
        run: python -m pip install gcovr

      - name: Build
        run: |
          mkdir -p build
          g++ -std=c++11 --coverage -O0 -g -Wall -Wextra -pedantic -Iinclude src/Fecha.cpp tests/main.cpp -o build/p4_tests

      - name: Run tests
        run: ./build/p4_tests

      - name: Enforce 90% line coverage for source files
        run: gcovr --root . --filter 'src/' --fail-under-line 90 build
