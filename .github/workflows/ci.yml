name: C++ CI

on:
  pull_request:
    branches: [develop]
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install gcovr
        run: python -m pip install gcovr==8.5

      - name: Compile all modules and run unit tests
        env:
          CXX: g++
        run: sh scripts/test.sh --coverage

      - name: Enforce 90% line coverage for source files
        run: gcovr --root . --filter 'src/' --merge-lines --fail-under-line 90 build-coverage
